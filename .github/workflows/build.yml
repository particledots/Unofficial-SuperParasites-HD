name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build-macos:
    runs-on: macos-14     # Apple silicon runner
    defaults:
      run:
        shell: bash .github/wrap.sh {0}   # same as plain bash, plus a readable error annotation when a step fails
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build engine test, then run it
        run: |
          cmake --build build --target engine_test -j4
          ./build/engine_test

      - name: Compare the 32 kHz and 48 kHz engines (delay times, pitch, reverb decay, spectrum, all eight modes)
        run: |
          cmake --build build --target rate_compare_test -j4
          ./build/rate_compare_test

      - name: The 32 kHz engine must give exactly the same samples as the Extended plug-in (commit 66d2161)
        run: |
          git clone https://github.com/particledots/Unofficial-SuperParasites-Extended.git ext
          git -C ext checkout 66d2161
          # Same compiler, same flags, same test program for both; only the DSP sources differ.
          FLAGS="-std=c++17 -O2 -DTEST=1 -w -include cstdio -include cstdlib -include cmath -include cstring -Wno-narrowing"
          SOURCES="src/SuperParasitesEngine.cpp third_party/supercell/dsp/correlator.cc third_party/supercell/dsp/granular_processor.cc third_party/supercell/dsp/kammerl_player.cc third_party/supercell/dsp/mu_law.cc third_party/supercell/dsp/pvoc/frame_transformation.cc third_party/supercell/dsp/pvoc/phase_vocoder.cc third_party/supercell/dsp/pvoc/spectral_clouds_transformation.cc third_party/supercell/dsp/pvoc/stft.cc third_party/supercell/resources.cc third_party/stmlib/utils/random.cc third_party/stmlib/dsp/units.cc third_party/stmlib/dsp/atan.cc"
          (cd ext && c++ $FLAGS -Isrc -Ithird_party ../tests/bit_exact_dump.cpp $SOURCES -o ../dump_extended)
          c++ $FLAGS -Isrc -Ithird_party tests/bit_exact_dump.cpp $SOURCES -o dump_hd
          ./dump_extended 6 > extended.txt
          ./dump_hd 6 > hd.txt
          wc -l extended.txt hd.txt
          diff extended.txt hd.txt && echo "IDENTICAL: 64 mode/quality/buffer-length combinations, 32 kHz engine"

      - name: Output level tests (fully dry output = input level within 0.1 dB in every mode with a dry path, limiter, no clipping)
        run: |
          cmake --build build --target level_test -j4
          ./build/level_test

      - name: Mutation check of the output stage (the level test must FAIL when the gain, its default, its dB conversion or the limiter is broken)
        run: bash tests/mutation_check.sh

      - name: Whole plug-in level test (the real processor class - Output Level parameter, default, dry output = input, limiter)
        run: |
          cmake --build build --target proc_level_test -j4
          ./build/proc_level_test

      - name: Wiring mutation check (the whole plug-in test must FAIL when the stage is not called, the level is not read, or the default is wrong)
        run: bash tests/wiring_mutation_check.sh build

      - name: Build AU + VST3
        run: cmake --build build --target SuperParasitesHD_AU SuperParasitesHD_VST3 -j4

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/SuperParasitesHD_artefacts/Release/AU/*.component build/SuperParasitesHD_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/SuperParasitesHD_artefacts/Release/AU/*.component dist/
          cp -R build/SuperParasitesHD_artefacts/Release/VST3/*.vst3 dist/
          lipo -archs dist/*.component/Contents/MacOS/*
          # Show the minimum macOS version baked into each slice (should say 11.0):
          for a in arm64 x86_64; do echo "== $a"; lipo -thin $a dist/*.component/Contents/MacOS/* -output /tmp/slice_$a; otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version"; done
          cat > dist/INSTALL.txt <<'TXT'
          1. Unzip.
          2. Open Terminal and run:   xattr -dr com.apple.quarantine ~/Downloads/SuperParasites-HD-macOS/*
             (adjust the path if you unzipped elsewhere; this clears the "downloaded from internet" block)
          3. Copy "Unofficial SuperParasites HD.component" to  ~/Library/Audio/Plug-Ins/Components/
             Copy "Unofficial SuperParasites HD.vst3"       to  ~/Library/Audio/Plug-Ins/VST3/
          4. In Logic: Settings > Plug-in Manager > rescan. Look for "particledots: Unofficial SuperParasites HD"
             (it is a MIDI-controlled effect: a MIDI note-on presses CAPTURE, a held note is GATE).
          6. OUTPUT LEVEL (version 0.2.0): the firmware makes the output about 9 dB quieter than the input (with Dry/Wet at 0 in most modes). The new
             OUTPUT LEVEL knob (default +9.03 dB) makes that up, followed by a soft limiter that keeps loud sounds from clipping. Presets made before
             0.2.0 have no Output Level and will come out about 9 dB louder: that is the fix, so lower the knob if you want the old level.
             Beat repeat and Resonestor have no dry path in the firmware, so Output Level does not make them match the input exactly.
          TXT
          ditto -c -k --keepParent dist SuperParasites-HD-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SuperParasites-HD-macOS
          path: SuperParasites-HD-macOS.zip
